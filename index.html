  <!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寿司打コミュニティランキング</title>
    <style>
        :root {
            --primary-color: #e63946;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 10px 20px;
            border: 2px solid #ccc;
            background: #fff;
            cursor: pointer;
            border-radius: 25px;
            font-weight: bold;
        }
        .tab-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media(min-width: 768px) {
            .main-layout { grid-template-columns: 1fr 2fr; }
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #2a9d8f;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th { background-color: #f1f1f1; }
        .score-plus { color: #2a9d8f; font-weight: bold; }
        .score-minus { color: #e63946; font-weight: bold; }
        
        /* 証拠画像リンク・プレビューのスタイル */
        .evidence-link {
            color: #2a9d8f;
            text-decoration: underline;
            cursor: pointer;
            font-size: 13px;
        }
        .preview-img {
            max-width: 100%;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            display: none;
        }
        /* モーダルウィンドウ（拡大画像表示用） */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            max-width: 900px;
            max-height: 80%;
            border-radius: 5px;
        }
        .modal-close {
            position: absolute;
            top: 20px; right: 30px;
            color: #fff; font-size: 40px; font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>寿司打 コミュニティランキング</h1>

    <div class="tabs" id="mode-tabs">
        <button class="tab-btn active" data-mode="normal">普通</button>
        <button class="tab-btn" data-mode="practice">練習</button>
        <button class="tab-btn" data-mode="sudden">一発勝負</button>
    </div>

    <div class="tabs" id="course-tabs">
        <button class="tab-btn active" data-course="3000">3000円コース</button>
        <button class="tab-btn" data-course="5000">5000円コース</button>
        <button class="tab-btn" data-course="10000">10000円コース</button>
    </div>

    <div class="main-layout">
        <!-- スコア登録フォーム -->
        <div class="card">
            <h2>スコアを登録</h2>
            <div class="form-group">
                <label>お名前</label>
                <input type="text" id="player-name" placeholder="名前を入力してください">
            </div>
            <div class="form-group">
                <label>お得になった金額 / 損した金額 (円)</label>
                <input type="number" id="score-amount" placeholder="例: 1240、損した場合は -340">
            </div>
            <div class="form-group">
                <label>正しく打ったキーの数 (回)</label>
                <input type="number" id="score-keys" placeholder="例: 350">
            </div>
            <div class="form-group">
                <label>結果のスクリーンショット（証拠画像）</label>
                <input type="file" id="score-image" accept="image/*">
                <img id="form-preview" class="preview-img" alt="アップロード予告">
            </div>
            <button class="submit-btn" id="submit-score">ランキングに登録する</button>
        </div>

        <!-- ランキング表示エリア -->
        <div class="card">
            <h2>現在のランキング (<span id="current-view-title">普通 - 3000円コース</span>)</h2>
            <table>
                <thead>
                    <tr>
                        <th>順位</th>
                        <th>名前</th>
                        <th>結果金額</th>
                        <th>正しく打ったキー</th>
                        <th>証拠</th>
                    </tr>
                </thead>
                <tbody id="ranking-tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 画像拡大用の空気ポップアップ（モーダル） -->
<div id="image-modal" class="modal">
    <span class="modal-close" id="modal-close">&times;</span>
    <img class="modal-content" id="modal-target-img">
</div>

<script>
    var currentMode = 'normal';
    var currentCourse = '3000';
    var rankingData = JSON.parse(localStorage.getItem('sushida_rankings')) || {};
    var currentBase64Image = ""; // 画像データを一時保存する変数

    // フォームで画像が選ばれた時のプレビュー処理
    document.getElementById('score-image').addEventListener('change', function(e) {
        var file = e.target.files[0];
        if (!file) return;

        var reader = new FileReader();
        reader.onload = function(event) {
            currentBase64Image = event.target.result; // 画像をテキストデータ化
            var preview = document.getElementById('form-preview');
            preview.src = currentBase64Image;
            preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
    });

    // モード切り替え
    var modeButtons = document.querySelectorAll('#mode-tabs .tab-btn');
    modeButtons.forEach(function(btn) {
        btn.addEventListener('click', function() {
            modeButtons.forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            currentMode = btn.getAttribute('data-mode');
            updateView();
        });
    });

    // コース切り替え
    var courseButtons = document.querySelectorAll('#course-tabs .tab-btn');
    courseButtons.forEach(function(btn) {
        btn.addEventListener('click', function() {
            courseButtons.forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            currentCourse = btn.getAttribute('data-course');
            updateView();
        });
    });

    function updateView() {
        var modeLabels = { normal: '普通', practice: '練習', sudden: '一発勝負' };
        document.getElementById('current-view-title').textContent = modeLabels[currentMode] + ' - ' + currentCourse + '円コース';
        
        var tbody = document.getElementById('ranking-tbody');
        tbody.innerHTML = '';

        var key = currentMode + '_' + currentCourse;
        var currentRankings = rankingData[key] || [];

        currentRankings.sort(function(a, b) {
            return b.amount - a.amount || b.keys - a.keys;
        });

        if (currentRankings.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#999;">データがありません。</td></tr>';
            return;
        }

        currentRankings.forEach(function(player, index) {
            var tr = document.createElement('tr');
            var rank = index + 1;
            
            var amountDisplay = '';
            if (player.amount >= 0) {
                amountDisplay = '<span class="score-plus">¥' + player.amount + ' お得</span>';
            } else {
                amountDisplay = '<span class="score-minus">¥' + Math.abs(player.amount) + ' 損</span>';
            }

            // 画像がある場合はリンクを表示、ない場合は「なし」
            var evidenceDisplay = 'なし';
            if (player.image) {
                evidenceDisplay = '<span class="evidence-link" onclick="openModal(\'' + player.name + '\', \'' + key + '\')">📄 見る</span>';
            }

            tr.innerHTML = '<td>' + rank + '</td><td><strong>' + player.name + '</strong></td><td>' + amountDisplay + '</td><td>' + player.keys + ' 回</td><td>' + evidenceDisplay + '</td>';
            tbody.appendChild(tr);
        });
    }

    // 登録処理
    document.getElementById('submit-score').addEventListener('click', function() {
        var name = document.getElementById('player-name').value.trim();
        var amount = parseInt(document.getElementById('score-amount').value, 10);
        var keys = parseInt(document.getElementById('score-keys').value, 10);

        if (!name || isNaN(amount) || isNaN(keys)) {
            alert('すべて正しく入力してください。');
            return;
        }

        var key = currentMode + '_' + currentCourse;
if (!rankingData[key]) rankingData[key] = [];
var scoreEntry = { name: name, amount: amount, keys: keys, image: currentBase64Image };
var existingIndex = rankingData[key].findIndex(function(p) { return p.name === name; });
if (existingIndex !== -1) {
if (amount > rankingData[key][existingIndex].amount) {
rankingData[key][existingIndex] = scoreEntry;
} else {
alert('ベストスコアを下回っているため更新されませんでした。');
return;
}
} else {
rankingData[key].push(scoreEntry);
}
try {
localStorage.setItem('sushida_rankings', JSON.stringify(rankingData));
} catch (e) {
alert('画像のデータが大きすぎるため保存できませんでした。画質を落とすか、小さめのスクショ画像を選択してください。');
return;
}
updateView();
// フォームリセット
document.getElementById('score-amount').value = '';
document.getElementById('score-keys').value = '';
document.getElementById('score-image').value = '';
document.getElementById('form-preview').style.display = 'none';
currentBase64Image = "";
alert('登録されました！');
});
// 🔍 画像をポップアップで拡大表示する処理
window.openModal = function(name, key) {
var players = rankingData[key] || [];
var player = players.find(function(p) { return p.name === name; });
if (player && player.image) {
document.getElementById('modal-target-img').src = player.image;
document.getElementById('image-modal').style.display = 'flex';
}
};
document.getElementById('modal-close').addEventListener('click', function() {
document.getElementById('image-modal').style.display = 'none';
});
document.getElementById('image-modal').addEventListener('click', function(e) {
if(e.target.id === "image-modal") {
document.getElementById('image-modal').style.display = 'none';
}
});
updateView();
</script>

</body>
</html>
